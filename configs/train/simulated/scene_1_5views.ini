# MITransient scene_1: five sparse training views, twenty held out.
exp_name = "scene_1_5views"
version = "simulated"
data_root_fp = "./data/scene_1.h5"
num_views = 5

# Dimensions read from data/scene_1.h5.
n_bins = 1034
img_shape = 256
img_shape_test = 256

# Scene geometry and temporal calibration used by the project notebook.
aabb = "[-1.8, -0.05, -1.8, 1.8, 3.55, 1.8]"
exposure_time = 0.009
start_opl = 10.1

tfilter_sigma = 3
rfilter_sigma = 0.15
num_rays_per_batch = 512
render_n_samples = 4096
grid_resolution = 128
grid_nlvl = 1
near_plane = 0
far_plane = 20
alpha_thre = 0
occ_thre = 0.01
space_carving = 0.007

lr = 1e-3
max_steps = 10000
steps_til_checkpoint = 2000
summary_every = 2000
summary_num_views = 1
sample_as_per_distribution = "False"
exp = "True"
final = "True"
outpath = "./results"
pixels_to_plot = ["(128, 128)", "(96, 128)", "(128, 96)"]
img_scale = 100
seed = 42
device = "cuda:0"
